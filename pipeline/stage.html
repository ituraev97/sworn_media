<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'DM Serif Display';src:url(fonts/dm-serif-display-latin-400-normal.woff2)}
@font-face{font-family:'Inter';font-weight:800;src:url(fonts/inter-latin-800-normal.woff2)}
@font-face{font-family:'Inter';font-weight:600;src:url(fonts/inter-latin-600-normal.woff2)}
@font-face{font-family:'Courier Prime';font-weight:400;src:url(fonts/courier-prime-latin-400-normal.woff2)}
@font-face{font-family:'Courier Prime';font-weight:700;src:url(fonts/courier-prime-latin-700-normal.woff2)}
:root{--night:#0b1020;--panel:#161d33;--hair:#2a3350;--paper:#f3eee3;--doc:#e9e2d0;--muted:#8a93a6;--gold:#c9a227;--red:#c8102e;--hook:#f2c94c}
*{margin:0;box-sizing:border-box}
html,body{background:var(--night);overflow:hidden}
#stage{position:relative;overflow:hidden;background:radial-gradient(1400px 1000px at 50% 45%,#121a33 0%,var(--night) 70%)}
.abs{position:absolute}
.kicker{font-family:Inter;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.src{font-family:Inter;font-weight:600;color:var(--muted)}
.serif{font-family:'DM Serif Display';font-weight:400;color:var(--paper)}
.sans{font-family:Inter;font-weight:600;color:var(--paper)}
.scene{position:absolute;inset:0;opacity:0}
.box{position:absolute}
.docframe{position:absolute;overflow:hidden;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.docframe img{position:absolute;left:0;top:0;width:100%;transform-origin:50% 0}
.hl{position:absolute;border:4px solid var(--gold);background:rgba(201,162,39,.12);opacity:0}
.tcard{position:absolute;background:var(--doc);background-image:repeating-linear-gradient(to bottom,transparent 0 var(--lh),rgba(11,16,32,.10) var(--lh) calc(var(--lh) + 2px))}
.tcard .hd{display:flex;justify-content:space-between;font-family:'Courier Prime';font-weight:700;color:var(--night);border-bottom:3px solid var(--night);letter-spacing:.04em}
.tcard .tx{font-family:'Courier Prime';color:var(--night)}
.tcard .cite{position:absolute;font-family:'Courier Prime';font-weight:700;color:#3a4258}
.tcard .recr{position:absolute;right:0;top:0;background:var(--night);color:var(--doc);font-family:Inter;font-weight:800;letter-spacing:.16em}
.caret{display:inline-block;background:var(--night);margin-left:2px}
.row{display:flex;align-items:baseline;border-top:2px solid var(--hair)}
.row .n{font-family:Inter;font-weight:800;color:var(--gold);letter-spacing:.12em;flex:none}
.stamp{display:inline-block;border:solid var(--red);color:var(--red);font-family:'DM Serif Display';letter-spacing:.05em}
.stamp.neutral{border-color:var(--paper);color:var(--paper)}
.cta{background:var(--gold);color:var(--night);font-family:Inter;font-weight:800;letter-spacing:.14em;text-align:center}
#subs{position:absolute;text-align:center;font-family:Inter;font-weight:800;color:var(--paper)}
#hud *{position:absolute}
</style></head>
<body><div id="stage"><div id="scenes"></div><div id="hud"></div><div id="subs"></div></div>
<script>
let T, MODE, W, H, U, BOX, BASE, built = {};
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
const cl = (x, a, b) => Math.max(a, Math.min(b, x));
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
const px = v => (v * U).toFixed(1) + 'px';
function el(parent, cls, css, html) { const e = document.createElement('div'); if (cls) e.className = cls; Object.assign(e.style, css || {}); if (html !== undefined) e.innerHTML = html; parent.appendChild(e); return e; }

function init(tm, base) {
  T = tm; MODE = tm.mode; BASE = base;
  if (MODE === 'long') { W = 1920; H = 1080; U = 1; BOX = { x: 130, y: 110, w: 1660, h: 760 }; }
  else { W = 1080; H = 1920; U = 0.86; BOX = { x: 72, y: 540, w: 936, h: 690 }; }
  const st = document.getElementById('stage'); st.style.width = W + 'px'; st.style.height = H + 'px';
  document.body.style.width = W + 'px'; document.body.style.height = H + 'px';
  const hud = document.getElementById('hud'); const sub = document.getElementById('subs');
  if (MODE === 'long') {
    hud.innerHTML = `<img id="wm" src="brand/seal.svg" style="right:52px;top:44px;width:64px;opacity:.55">`;
    Object.assign(sub.style, { left: '160px', width: '1600px', bottom: '64px', fontSize: '46px', lineHeight: '1.18',
      textShadow: '0 0 8px #0b1020,0 0 8px #0b1020,3px 3px 0 #0b1020,-3px -3px 0 #0b1020,3px -3px 0 #0b1020,-3px 3px 0 #0b1020' });
  } else {
    hud.innerHTML = `<div class="kicker" id="tag" style="left:64px;top:208px;font-size:26px">● SWORN · REAL VERDICT</div>
      <div class="serif" id="hook" style="left:64px;top:252px;width:860px;font-size:78px;line-height:.98">${esc(T.hook).replace(/\|/g, '<br>')}</div>
      <img id="wm" src="brand/seal.svg" style="right:56px;top:186px;width:84px;opacity:.6">`;
    Object.assign(sub.style, { left: '60px', width: '960px', top: '1335px', fontSize: '64px', lineHeight: '1.1',
      textShadow: '0 0 6px #0b1020,0 0 6px #0b1020,0 0 10px #0b1020,3px 3px 0 #0b1020,-3px -3px 0 #0b1020,3px -3px 0 #0b1020,-3px 3px 0 #0b1020' });
  }
}
const img = p => (p.startsWith('/') || p.startsWith('brand/')) ? p : BASE + '/' + p;

/* ---------- scene builders: build(root, s) returns update(lt, blk) ---------- */
const B = {};
const srcLine = (r, s) => s.src ? el(r, 'abs src', { left: px(0), top: px(BOX.h / U - 34), fontSize: px(24), width: BOX.w + 'px' }, esc(s.src)) : null;

B.title = (r, s) => {
  const k = el(r, 'abs kicker', { left: 0, top: px(MODE === 'long' ? 200 : 60), fontSize: px(28) }, esc(s.kicker || T.label));
  const t = el(r, 'abs serif', { left: 0, top: px(MODE === 'long' ? 250 : 110), width: BOX.w + 'px', fontSize: px(MODE === 'long' ? 118 : 96), lineHeight: '1' }, esc(s.title).replace(/\|/g, '<br>'));
  const line = el(r, 'abs', { left: 0, height: px(8), background: 'var(--red)', width: '0px' });
  const sub = el(r, 'abs sans', { left: 0, fontSize: px(34), color: 'var(--muted)', width: BOX.w + 'px' }, esc(s.sub));
  return (lt) => {
    const y = t.offsetTop + t.offsetHeight; line.style.top = (y + 26 * U) + 'px'; sub.style.top = (y + 60 * U) + 'px';
    const p = ease(cl(lt / 0.6, 0, 1)); t.style.opacity = p; k.style.opacity = p; t.style.transform = `translateY(${(1 - p) * 24}px)`;
    line.style.width = (ease(cl((lt - 0.4) / 0.5, 0, 1)) * 120 * U) + 'px'; sub.style.opacity = ease(cl((lt - 0.6) / 0.5, 0, 1));
  };
};
B.chapter = (r, s) => {
  const n = el(r, 'abs serif', { left: 0, top: px(MODE === 'long' ? 230 : 120), fontSize: px(150), color: 'var(--gold)', lineHeight: '1' }, esc(s.n));
  const t = el(r, 'abs serif', { left: 0, top: px(MODE === 'long' ? 410 : 300), width: BOX.w + 'px', fontSize: px(100), lineHeight: '1' }, esc(s.title));
  const k = el(r, 'abs kicker', { left: 0, top: px(MODE === 'long' ? 180 : 70), fontSize: px(26), color: 'var(--muted)' }, esc(s.kicker || 'CHAPTER'));
  return (lt) => { const p = ease(cl(lt / 0.5, 0, 1)), q = ease(cl((lt - 0.25) / 0.5, 0, 1)); n.style.opacity = p; k.style.opacity = p; t.style.opacity = q; t.style.transform = `translateX(${(1 - q) * 30}px)`; };
};
B.doc = (r, s) => {
  // real document scan; s.img, s.pan=[from,to] (fraction of image height at top of frame), s.hl=[x,y,w,h] fractions of image, s.zoom
  const long = MODE === 'long';
  const fw = long ? 1000 : BOX.w, fx = long ? BOX.w - 1000 : 0, fy = long ? 0 : 70 * U, fh = long ? BOX.h - 50 : BOX.h - 70 * U - 50 * U;
  if (long) {
    const col = el(r, 'abs', { left: 0, top: px(60), width: '580px', display: 'flex', flexDirection: 'column', gap: px(18) });
    if (s.kicker) el(col, 'kicker', { fontSize: px(26), lineHeight: '1.35' }, esc(s.kicker));
    if (s.title) el(col, 'serif', { fontSize: px(64), lineHeight: '1.05' }, esc(s.title));
    if (s.note) el(col, 'sans', { fontSize: px(32), lineHeight: '1.35', color: 'var(--muted)', marginTop: px(24) }, esc(s.note));
  } else if (s.kicker) el(r, 'abs kicker', { left: 0, top: 0, fontSize: px(26), width: BOX.w + 'px' }, esc(s.kicker));
  const f = el(r, 'docframe', { left: fx + 'px', top: fy + 'px', width: fw + 'px', height: fh + 'px' });
  const im = document.createElement('img'); im.src = img(s.img); f.appendChild(im);
  let hl = null; if (s.hl) hl = el(f, 'hl', {});
  srcLine(r, s);
  const pan = s.pan || [0, 0.12], z = s.zoom || 1;
  return (lt, blk) => {
    const d = blk.b - blk.a, p = cl(lt / d, 0, 1); const ih = im.naturalHeight * (fw / im.naturalWidth) * z;
    const y = -(pan[0] + (pan[1] - pan[0]) * p) * ih; const sc = z * (1 + 0.025 * p);
    im.style.transform = `translateY(${y}px) scale(${sc})`;
    if (hl) { const [hx, hy, hw, hh] = s.hl; const iw = fw * sc, ihh = im.naturalHeight * (fw / im.naturalWidth) * sc;
      Object.assign(hl.style, { left: (fw / 2 - iw / 2 + hx * iw) + 'px', top: (y + hy * ihh) + 'px', width: (hw * iw) + 'px', height: (hh * ihh) + 'px', opacity: ease(cl((lt - d * 0.35) / 0.3, 0, 1)) }); }
  };
};
B.photo = (r, s) => {
  const f = el(r, 'docframe', { left: 0, top: 0, width: BOX.w + 'px', height: (BOX.h - 50 * U) + 'px', background: '#000' });
  const im = document.createElement('img'); im.src = img(s.img); im.style.width = '100%'; im.style.height = '100%'; im.style.objectFit = s.fit || 'cover'; im.style.transformOrigin = '50% 50%'; f.appendChild(im);
  if (s.caption) el(r, 'abs', { left: px(20), top: px(20), background: 'rgba(11,16,32,.86)', padding: px(14) + ' ' + px(20), borderLeft: px(8) + ' solid var(--gold)' }, `<div class="kicker" style="font-size:${px(22)}">${esc(s.caption)}</div>`);
  srcLine(r, s);
  return (lt, blk) => { const p = cl(lt / (blk.b - blk.a), 0, 1); im.style.transform = `scale(${1.02 + 0.05 * p})`; };
};
B.quote = (r, s) => {
  const long = MODE === 'long'; const fs = (s.size || (long ? 46 : 42)) * (long ? 1.25 : 1.2); const lh = Math.round(fs * 1.3 * U);
  const c = el(r, 'tcard', { left: long ? '170px' : 0, top: 0, width: (long ? BOX.w - 340 : BOX.w) + 'px', height: (BOX.h - 50 * U) + 'px', padding: px(48) + ' ' + px(56) });
  c.style.setProperty('--lh', lh + 'px');
  el(c, 'hd', { fontSize: px(22), paddingBottom: px(14), marginBottom: px(26) }, `<span>${esc(s.case || '')}</span><span>${esc(s.doc || '')}</span>`);
  const tx = el(c, 'tx', { fontSize: px(fs), lineHeight: lh + 'px' });
  el(c, 'cite', { left: px(56), bottom: px(28), fontSize: px(22) }, esc(s.cite || ''));
  if (s.recreated) el(c, 'recr', { fontSize: px(16), padding: px(8) + ' ' + px(12) }, 'RECREATED · VERBATIM TEXT');
  const q = s.q; const caret = `<span class="caret" style="width:${px(fs * 0.5)};height:${px(fs * 0.9)};vertical-align:${px(-fs * 0.12)}"></span>`;
  return (lt, blk) => {
    const d = (blk.b - blk.a) * 0.86, p = cl((lt - 0.15) / d, 0, 1), n = Math.round(q.length * p);
    tx.innerHTML = (s.speaker ? `<b>${esc(s.speaker)}</b> ` : '') + '“' + esc(q.slice(0, n)) + (p < 1 ? caret : '”');
  };
};
B.big = (r, s) => {
  const ls = s.lines || [s.text]; const fs = s.size || (MODE === 'long' ? 132 : 116);
  if (s.kicker) el(r, 'abs kicker', { left: 0, top: px(MODE === 'long' ? 170 : 40), fontSize: px(26) }, esc(s.kicker));
  let yy = MODE === 'long' ? 220 : 90;
  const els = ls.map((t, i) => { const e = el(r, 'abs serif', { left: 0, width: BOX.w + 'px', top: px(yy), fontSize: px(fs), lineHeight: '1', color: i === ls.length - 1 && ls.length > 1 ? 'var(--gold)' : 'var(--paper)' }, esc(t).replace(/\|/g, '<br>')); yy += fs * (String(t).split('|').length) + fs * 0.12; return e; });
  srcLine(r, s);
  return (lt, blk) => {
    els.forEach((e, i) => { const at = i === 0 ? 0 : (blk.lines[i] !== undefined ? blk.lines[i] - blk.a - 0.1 : (blk.b - blk.a) * (0.5 + 0.2 * (i - 1))); const p = ease(cl((lt - at) / 0.3, 0, 1)); e.style.opacity = p; e.style.transform = `translateY(${(1 - p) * 18}px)`; });
  };
};
B.stat = (r, s) => {
  if (s.kicker) el(r, 'abs kicker', { left: 0, top: px(MODE === 'long' ? 180 : 40), fontSize: px(26) }, esc(s.kicker));
  const v = el(r, 'abs serif', { left: 0, top: px(MODE === 'long' ? 230 : 90), fontSize: px(MODE === 'long' ? 220 : 170), lineHeight: '1', color: 'var(--gold)' }, esc(s.value));
  const l = el(r, 'abs sans', { left: 0, top: px(MODE === 'long' ? 480 : 300), width: BOX.w + 'px', fontSize: px(40), lineHeight: '1.3' }, esc(s.label).replace(/\|/g, '<br>'));
  srcLine(r, s);
  return (lt) => { const p = ease(cl(lt / 0.5, 0, 1)); v.style.opacity = p; v.style.transform = `scale(${1.06 - 0.06 * p})`; v.style.transformOrigin = '0 50%'; l.style.opacity = ease(cl((lt - 0.4) / 0.4, 0, 1)); };
};
B.bars = (r, s) => {
  // s.items=[{label,value,display}]
  const long = MODE === 'long';
  el(r, 'abs kicker', { left: 0, top: 0, fontSize: px(26) }, esc(s.kicker || ''));
  if (s.title) el(r, 'abs serif', { left: 0, top: px(40), width: BOX.w + 'px', fontSize: px(60), lineHeight: '1.05' }, esc(s.title));
  const n = s.items.length, max = Math.max(...s.items.map(i => i.value));
  const area = { x: long ? 200 : 40 * U, y: long ? 230 : 210 * U, w: long ? 1260 : BOX.w - 80 * U, h: long ? 400 : 330 * U };
  el(r, 'abs', { left: area.x + 'px', top: (area.y + area.h) + 'px', width: area.w + 'px', height: '3px', background: 'var(--hair)' });
  const bw = Math.min(300 * U, area.w / n * 0.62), gap = area.w / n;
  const parts = s.items.map((it, i) => {
    const x = area.x + gap * i + (gap - bw) / 2;
    const bar = el(r, 'abs', { left: x + 'px', width: bw + 'px', bottom: (BOX.h - area.y - area.h) + 'px', height: '0px', background: i === n - 1 ? 'var(--gold)' : 'var(--doc)' });
    const lab = el(r, 'abs serif', { left: (x - 40) + 'px', width: (bw + 80) + 'px', textAlign: 'center', fontSize: px(60), lineHeight: '1' }, esc(it.display));
    el(r, 'abs kicker', { left: (x - 60) + 'px', width: (bw + 120) + 'px', textAlign: 'center', top: (area.y + area.h + 18) + 'px', fontSize: px(22), color: 'var(--muted)' }, esc(it.label));
    return { bar, lab, it };
  });
  srcLine(r, s);
  return (lt, blk) => {
    parts.forEach((p, i) => { const at = blk.lines[i] !== undefined && s.sync ? blk.lines[i] - blk.a : 0.3 + i * 0.7; const q = ease(cl((lt - at) / 0.9, 0, 1)); const h = area.h * p.it.value / max * q;
      p.bar.style.height = h + 'px'; p.lab.style.top = (area.y + area.h - h - 76 * U) + 'px'; p.lab.style.opacity = q; });
  };
};
B.list = (r, s) => {
  el(r, 'abs kicker', { left: 0, top: 0, fontSize: px(26) }, esc(s.kicker || ''));
  const box = el(r, 'abs', { left: 0, top: px(50), width: BOX.w + 'px' });
  const fs = s.size || (s.items.length > 8 ? 30 : 38);
  const rows = s.items.map(it => { const e = el(box, 'row', { padding: px(fs * 0.36) + ' 0', gap: px(24) }); el(e, 'n', { fontSize: px(fs * 0.7), width: px(170) }, esc(it[0])); el(e, 'sans', { fontSize: px(fs), lineHeight: '1.2' }, esc(it[1])); return e; });
  srcLine(r, s);
  return (lt, blk) => { const step = Math.min(0.45, Math.max(0.14, (blk.b - blk.a - 1) / rows.length)); rows.forEach((e, i) => { const p = ease(cl((lt - 0.15 - i * step) / 0.25, 0, 1)); e.style.opacity = p; e.style.transform = `translateX(${(1 - p) * 24}px)`; }); };
};
B.timeline = (r, s) => {
  // s.events=[{date,text}], highlight index s.at
  el(r, 'abs kicker', { left: 0, top: 0, fontSize: px(26) }, esc(s.kicker || 'TIMELINE'));
  const long = MODE === 'long', n = s.events.length;
  const evs = s.events.map((ev, i) => {
    const e = long ? el(r, 'abs', { left: (i * BOX.w / n) + 'px', top: '200px', width: (BOX.w / n - 40) + 'px' })
                   : el(r, 'abs', { left: px(40), top: px(70 + i * (560 / n)), width: (BOX.w - 60 * U) + 'px' });
    el(e, '', { width: px(22), height: px(22), borderRadius: '50%', background: i === s.at ? 'var(--gold)' : 'var(--paper)', marginBottom: px(20), marginLeft: long ? '0' : px(-50), position: long ? 'static' : 'absolute', top: px(10) });
    el(e, 'kicker', { fontSize: px(24), color: i === s.at ? 'var(--gold)' : 'var(--muted)' }, esc(ev.date));
    el(e, 'serif', { fontSize: px(long ? 46 : 44), lineHeight: '1.1', marginTop: px(10) }, esc(ev.text));
    return e;
  });
  const axis = long ? el(r, 'abs', { left: 0, top: '210px', height: '3px', width: '0px', background: 'var(--hair)' }) : el(r, 'abs', { left: px(51), top: px(80), width: '3px', height: '0px', background: 'var(--hair)' });
  srcLine(r, s);
  return (lt, blk) => { const d = blk.b - blk.a; if (long) axis.style.width = (ease(cl(lt / 0.8, 0, 1)) * BOX.w) + 'px'; else axis.style.height = (ease(cl(lt / 0.8, 0, 1)) * 540 * U) + 'px';
    evs.forEach((e, i) => { const at = s.sync && blk.lines[i] !== undefined ? blk.lines[i] - blk.a : 0.3 + i * Math.min(0.9, (d - 1) / n); const p = ease(cl((lt - at) / 0.35, 0, 1)); e.style.opacity = p; e.style.transform = long ? `translateY(${(1 - p) * 20}px)` : `translateX(${(1 - p) * 20}px)`; }); };
};
B.verdict = (r, s) => {
  const long = MODE === 'long';
  el(r, 'abs kicker', { left: 0, width: BOX.w + 'px', textAlign: 'center', top: px(long ? 120 : 20), fontSize: px(26), color: 'var(--muted)' }, esc(s.kicker || 'THE VERDICT'));
  const w = el(r, 'abs', { left: 0, width: BOX.w + 'px', textAlign: 'center', top: px(long ? 210 : 110) });
  const st = el(w, 'stamp' + (s.neutral ? ' neutral' : ''), { borderWidth: px(10), fontSize: px(long ? 128 : 124), padding: px(22) + ' ' + px(50) + ' ' + px(10) }, esc(s.stamp || 'GUILTY'));
  const big = el(r, 'abs serif', { left: 0, width: BOX.w + 'px', textAlign: 'center', top: px(long ? 470 : 350), fontSize: px(long ? 120 : 130), lineHeight: '1' }, esc(s.big || ''));
  const sub = el(r, 'abs sans', { left: 0, width: BOX.w + 'px', textAlign: 'center', top: px(long ? 620 : 510), fontSize: px(34), color: 'var(--muted)' }, esc(s.sub || ''));
  const k = s.at ?? 0.7;
  return (lt) => { const p = cl((lt - k) / 0.18, 0, 1); st.style.opacity = lt < k ? 0 : 1; st.style.transform = `rotate(-4deg) scale(${1.15 - 0.15 * p})`;
    big.style.opacity = ease(cl((lt - k - 0.35) / 0.35, 0, 1)); sub.style.opacity = ease(cl((lt - k - 0.7) / 0.35, 0, 1)); };
};
B.end = (r, s) => {
  const long = MODE === 'long';
  const cx = BOX.w / 2;
  const im = document.createElement('img'); im.src = 'brand/seal.svg'; Object.assign(im.style, { position: 'absolute', width: px(long ? 220 : 300), left: (cx - (long ? 110 : 150) * U) + 'px', top: px(long ? 60 : 0) }); r.appendChild(im);
  el(r, 'abs serif', { left: 0, width: BOX.w + 'px', textAlign: 'center', top: px(long ? 300 : 340), fontSize: px(long ? 150 : 170), lineHeight: '1' }, 'SWORN');
  el(r, 'abs', { left: (cx - 50 * U) + 'px', top: px(long ? 475 : 530), width: px(100), height: px(8), background: 'var(--red)' });
  el(r, 'abs kicker', { left: 0, width: BOX.w + 'px', textAlign: 'center', top: px(long ? 510 : 570), fontSize: px(26) }, 'REAL TRIALS · REAL EVIDENCE · THE VERDICT');
